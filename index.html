      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px 10px;
    }

    /* 右上に固定表示するシェア/URLコピーボタン */
    .top-share-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background-color: rgba(30, 30, 30, 0.85);
      color: #fff;
      border: 1px solid #ffd700;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      width: auto;
      transition: background-color 0.2s, transform 0.1s;
    }
    .top-share-btn:hover {
      background-color: #ffd700;
      color: #000;
    }
    .top-share-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .header-account {
      font-size: 1rem;
      color: #ddd;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      margin-top: 0;
      color: #fff;
    }
    .progress {
      color: #ffd700;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .star-accent {
      color: #ffd700;
      font-size: 1.1rem;
      margin: 0 4px;
    }

    /* 4人表示エリア */
    .quad-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 360px;
      margin: 0 auto 16px;
    }

    /* 2人表示エリア */
    .duo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      max-width: 380px;
      margin: 0 auto 16px;
    }

    .vs-label {
      font-weight: bold;
      font-size: 1.2rem;
      color: #ffd700;
    }

    .card {
      background-color: #1e1e1e;
      border: 2px solid #444;
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      flex: 1;
    }
    .card.selected {
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      background-color: #2a2a1e;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .card .name {
      margin-top: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      word-break: break-all;
      line-height: 1.2;
    }

    /* 結果エリア */
    #result-area {
      display: none;
    }
    #capture-zone {
      background-color: #181818;
      padding: 14px 12px 12px;
      width: 320px;
      margin: 0 auto 20px;
      border: 2px solid #444;
      border-radius: 12px;
      box-sizing: border-box;
    }

    /* 画像に含めるアカウント名表記 */
    .result-account-tag {
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .result-title {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3x3 グリッド */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .grid-item {
      background-color: #222;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 4px;
    }
    .grid-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .grid-item .name-tag {
      font-size: 0.7rem;
      font-weight: bold;
      color: #fff;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 90%;
      text-align: center;

    .rank-badge {
      position: absolute;
      top: 3px;
      left: 3px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffd700;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 3px;
      z-index: 2;
    }

    /* ボタン群 */

      flex-direction: column;
      gap: 10px;
      align-items: center;

      background-color: #ffd700;

      font-weight: bold;

    button:disabled {

      opacity: 0.9;
    }
    .btn-sns {
      background-color: #333;
      color: #fff;
      border: 1px solid #666;
    }
  </style>
</head>

    let allMembers = [];
    let quadPool = [];
    let duoPool = [];
    let nextDuoPool = [];
    
    let currentQuadGroup = [];
    let selectedQuadIndices = [];
    let duoIndex = 0;
    let roundNumber = 1;
    let totalInitialMembers = 0;

    let eliminationRecords = [];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function initGame() {
      allMembers = rawMembers.map(m => ({ ...m, wins: 0, quadPassed: false }));
      totalInitialMembers = allMembers.length;
      eliminationRecords = [];
      duoPool = [];
      quadPool = [...allMembers];
      shuffle(quadPool);
      nextQuadMatch();
    }

    // URLコピー処理
    function copyPageURL() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        alert('URLをコピーしました！友達に共有して遊んでもらいましょう。');
      }).catch(() => {
        const tempInput = document.createElement('input');
        tempInput.value = url;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        alert('URLをコピーしました！友達に共有して遊んでもらいましょう。');
      });
    }

    // --- 第1ステージ：99人全員がまず4人グループを一周 ---
    function nextQuadMatch() {
      document.getElementById('stage-title').innerHTML = '<span class="star-accent">★</span> 好きな顔を最大2人選んでください <span class="star-accent">★</span>';
      document.getElementById('next-btn').style.display = 'inline-block';

      if (quadPool.length === 0) {
        startDuoStage();
        return;
      }

      currentQuadGroup = [];
      const count = Math.min(4, quadPool.length);
      for (let i = 0; i < count; i++) {
        currentQuadGroup.push(quadPool.pop());
      }
      selectedQuadIndices = [];
      renderQuadUI();
    }

    function renderQuadUI() {
      const container = document.getElementById('match-container');
      container.className = 'quad-container';
      container.innerHTML = '';

      const remaining = quadPool.length + currentQuadGroup.length;
      document.getElementById('progress-text').innerText = `【予選】未チェック: 残り ${remaining} / ${totalInitialMembers} 人`;
      document.getElementById('next-btn').disabled = false;

      currentQuadGroup.forEach((member, idx) => {
        const card = document.createElement('div');
        card.className = `card ${selectedQuadIndices.includes(idx) ? 'selected' : ''}`;
        card.onclick = () => toggleQuadSelect(idx);
        card.innerHTML = `
          <img src="${member.img}" alt="${member.name}">
          <div class="name">${member.name}</div>
        `;
        container.appendChild(card);
      });
    }

    function toggleQuadSelect(idx) {
      const pos = selectedQuadIndices.indexOf(idx);
      if (pos > -1) {
        selectedQuadIndices.splice(pos, 1);
      } else {
        if (selectedQuadIndices.length < 2) {
          selectedQuadIndices.push(idx);
        }
      }
      renderQuadUI();
    }

    function confirmQuadSelection() {
      currentQuadGroup.forEach((member, idx) => {
        if (selectedQuadIndices.includes(idx)) {
          member.quadPassed = true;
          duoPool.push(member);
        } else {
          eliminationRecords.push({ member, round: 0, wins: 0 });
        }
      });
      nextQuadMatch();
    }

    // --- 第2ステージ：勝ち抜きメンバーによる2人対戦トーナメント ---
    function startDuoStage() {
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('stage-title').innerHTML = '<span class="star-accent">★</span> 好きな顔を選んでください <span class="star-accent">★</span>';

      if (duoPool.length <= 1) {
        if (duoPool.length === 1) {
          eliminationRecords.push({ member: duoPool[0], round: 1, wins: 0 });
        }
        finishGame();
        return;
      }

      shuffle(duoPool);
      roundNumber = 1;
      duoIndex = 0;
      nextDuoPool = [];

      nextDuoMatch();
    }

    function nextDuoMatch() {
      if (duoPool.length === 1 && nextDuoPool.length === 0) {
        eliminationRecords.push({ member: duoPool[0], round: roundNumber, wins: duoPool[0].wins });
        finishGame();
        return;
      }

      if (duoIndex >= duoPool.length - 1) {
        if (duoIndex < duoPool.length) {
          nextDuoPool.push(duoPool[duoIndex]);
        }
        duoPool = [...nextDuoPool];
        nextDuoPool = [];
        duoIndex = 0;
        roundNumber++;
        shuffle(duoPool);

        if (duoPool.length === 1) {
          eliminationRecords.push({ member: duoPool[0], round: roundNumber, wins: duoPool[0].wins });
          finishGame();
          return;
        }
      }

      document.getElementById('progress-text').innerText = `【本戦トーナメント】残り人数: ${duoPool.length - duoIndex + nextDuoPool.length}人`;
      renderDuoUI();
    }

    function renderDuoUI() {
      const container = document.getElementById('match-container');
      container.className = 'duo-container';
      container.innerHTML = '';

      const memberA = duoPool[duoIndex];
      const memberB = duoPool[duoIndex + 1];

      container.innerHTML = `
        <div class="card" onclick="selectDuoWinner(0)">
          <img src="${memberA.img}" alt="${memberA.name}">
          <div class="name">${memberA.name}</div>
        </div>
        <div class="vs-label">VS</div>
        <div class="card" onclick="selectDuoWinner(1)">
          <img src="${memberB.img}" alt="${memberB.name}">
          <div class="name">${memberB.name}</div>
        </div>
      `;
    }

    function selectDuoWinner(choice) {
      const winner = duoPool[duoIndex + choice];
      const loser = duoPool[duoIndex + (1 - choice)];

      winner.wins += 1;
      nextDuoPool.push(winner);

      eliminationRecords.push({ member: loser, round: roundNumber, wins: loser.wins });

      duoIndex += 2;
      nextDuoMatch();
    }

    // --- 結果算出と表示 ---
    function finishGame() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('result-area').style.display = 'block';

      eliminationRecords.sort((a, b) => {
        if (b.round !== a.round) return b.round - a.round;
        return b.wins - a.wins;
      });

      const top9 = eliminationRecords.slice(0, 9).map(r => r.member);

      const layoutOrder = [
        3, 4, 5,
        1, 0, 2,
        6, 7, 8
      ];

      const grid = document.getElementById('result-grid');
      grid.innerHTML = '';

      layoutOrder.forEach(rankIdx => {
        const member = top9[rankIdx];
        if (!member) return;

        const actualRank = rankIdx + 1;

        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `
          <span class="rank-badge">${actualRank}位</span>
          <img src="${member.img}" alt="${member.name}">
          <div class="name-tag">${member.name}</div>
        `;
        grid.appendChild(item);
      });
    }

    // スマホ対応：長押し保存モーダル表示（方法1）
    function downloadResult() {
      const captureZone = document.getElementById('capture-zone');
      
      html2canvas(captureZone, { scale: 2, useCORS: true }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');

        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100vw';
        modal.style.height = '100vh';
        modal.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
        modal.style.zIndex = '9999';
        modal.style.display = 'flex';
        modal.style.flexDirection = 'column';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.padding = '20px';
        modal.style.boxSizing = 'border-box';

        modal.innerHTML = `
          <p style="color: #ffd700; font-weight: bold; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.4;">
            画像を長押しして「"写真"に追加」<br>または「画像を保存」を選んでください
          </p>
          <img src="${imgData}" style="max-width: 90%; max-height: 65vh; border-radius: 12px; border: 2px solid #444;" />
          <button id="close-modal-btn" style="margin-top: 16px; background: #444; color: #fff; width: 140px; padding: 10px; border-radius: 20px;">閉じる</button>
        `;

        document.body.appendChild(modal);

        document.getElementById('close-modal-btn').onclick = () => {
          document.body.removeChild(modal);
        };
      });
    }

    function shareOnSNS() {
      const shareText = `【私の好きな顔9人】\nby @myserenit_y 🍀`;
      
      if (navigator.share) {
        navigator.share({
          title: '私の好きな顔9人',
          text: shareText,
          url: window.location.href
        }).catch(() => {});
      } else {
        copyPageURL();
      }
    }

    initGame();
  </script>
